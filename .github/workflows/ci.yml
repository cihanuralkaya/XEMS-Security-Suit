name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Vet + Test + Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Proto kodunu üret (gen/ commit edilmez; buf ile üretilir).
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: protoc-gen eklentileri
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Proto üret
        run: make proto

      - name: gofmt kontrolü
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Biçimsiz dosyalar (gofmt -w ile düzeltin):"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race: eşzamanlı kod (eventbus pub/sub, cluster fan-out, memstore/collector
      # kilitleri) veri yarışına karşı doğrulanır. CGO gerektirir; ubuntu-latest'te
      # gcc mevcuttur. Yerel Windows geliştirme hostunda cgo/gcc yoksa `go test ./...`
      # (yarışsız) çalıştırın.
      - name: go test (-race)
        run: go test -race ./...

      - name: Uçtan uca smoke test
        run: bash scripts/smoke-test.sh

  db-test:
    name: DB yolu (PostgreSQL)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xems
          POSTGRES_PASSWORD: xems
          POSTGRES_DB: xems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xems"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: protoc-gen eklentileri
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Proto üret
        run: make proto
      - name: psql istemcisi
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # smoke-test.sh, XEMS_DATABASE_URL görünce şemayı yükler, admin tohumlar ve
      # tüm zinciri GERÇEK PostgreSQL'e karşı çalıştırır (pgx yolu).
      - name: DB uçtan uca smoke test
        env:
          XEMS_DATABASE_URL: postgres://xems:xems@localhost:5432/xems?sslmode=disable
        run: bash scripts/smoke-test.sh

  security:
    name: Güvenlik (govulncheck + fuzz + SBOM)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: protoc-gen eklentileri
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Proto üret
        run: make proto

      # Bağımlılık zafiyet taraması (bilinen CVE'ler). Bulgu → job kırmızı.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Kritik ayrıştırıcıların kısa fuzz taraması (panik regresyon kalkanı).
      - name: Fuzz (kısa)
        run: FUZZTIME=15s bash scripts/fuzz.sh

      # SBOM üretimi (CycloneDX) — tedarik zinciri şeffaflığı. Artifact olarak yüklenir.
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: warn

      # Statik güvenlik analizi (gosec). Bilgilendirici — bulgular job'ı kırmazın
      # (kademeli benimseme); SARIF ileride Code Scanning'e bağlanabilir.
      - name: gosec (bilgilendirici)
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -quiet ./... || true

  release:
    name: Çapraz derleme (release)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: protoc-gen eklentileri
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Proto üret
        run: make proto
      - name: Release ikilileri
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: xems-binaries
          path: dist/
          if-no-files-found: error
